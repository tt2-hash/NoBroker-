<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student accommodation: Andheri and Vile Parle</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;line-height:1.45}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
  label{display:flex;flex-direction:column;font-size:.85rem;gap:3px}
  .banner{border:1px solid #c90;background:#fff8e1;color:#4a3800;padding:10px;border-radius:6px;margin:8px 0}
  .card{border:1px solid #bbb;border-radius:8px;padding:12px;margin:10px 0}
  .tag{display:inline-block;font-size:.75rem;border:1px solid #888;border-radius:4px;padding:1px 6px;margin-right:6px}
  .demo{background:#fde7e7;border-color:#b00;color:#700}
  .small{font-size:.75rem;opacity:.75;margin:6px 0 0}
  dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;margin:8px 0}
  dt{font-weight:600} dd{margin:0}
  @media (prefers-color-scheme: dark){
    body{background:#161616;color:#eee}
    .banner{background:#3a2f00;color:#ffe8a0}
    .demo{background:#4a1d1d;color:#ffb4b4}
    a{color:#8ab4ff}
  }
</style>
</head>
<body>
<h1>Find student accommodation</h1>
<form id="f">
  <label>Locality<select id="locality"><option value="">Any</option><option value="ANDHERI">Andheri</option><option value="VILE_PARLE">Vile Parle</option></select></label>
  <label>Min rent (₹)<input id="minRent" type="number" min="0"></label>
  <label>Max rent (₹)<input id="maxRent" type="number" min="0"></label>
  <label>Accommodation<select id="audience"><option value="">Any</option><option value="BOYS">Boys</option><option value="GIRLS">Girls</option><option value="CO_ED">Co-ed</option></select></label>
  <label>Room sharing<select id="sharing"><option value="">Any</option><option value="SINGLE">Single</option><option value="DOUBLE">Double</option></select></label>
  <label>Food<select id="food"><option value="">Any</option><option value="VEG">Vegetarian</option><option value="NON_VEG">Non-vegetarian</option><option value="JAIN">Jain</option></select></label>
  <label>Availability<select id="availability"><option value="">Any</option><option value="AVAILABLE">Available</option></select></label>
  <label>Amenities (comma separated)<input id="amenities" placeholder="wifi, laundry"></label>
  <button type="submit">Search</button>
</form>
<p><small>Only listings where the chosen details are confirmed are shown. Listings with "Not specified" for a chosen filter are left out.</small></p>
<div id="banner"></div>
<div id="count"></div>
<div id="results"></div>
<script>
const $ = id => document.getElementById(id);
function el(tag, text, cls){ const e=document.createElement(tag); if(text!=null) e.textContent=text; if(cls) e.className=cls; return e; }

async function search(ev){
  if(ev) ev.preventDefault();
  const p = new URLSearchParams();
  for (const k of ['locality','minRent','maxRent','audience','sharing','food','availability']) {
    const v = $(k).value.trim(); if (v) p.append(k, v);
  }
  $('amenities').value.split(',').map(s=>s.trim()).filter(Boolean).forEach(a=>p.append('amenities', a));
  const r = await fetch('/api/listings?' + p.toString());
  if(!r.ok){ $('results').textContent = 'Search failed. Please check your filters.'; return; }
  render(await r.json());
}

function render(d){
  const b = $('banner'); b.replaceChildren();
  b.append(el('div', d.notice, 'banner'), el('div', d.disclaimer, 'banner'));
  $('count').textContent = d.count + ' matching propert' + (d.count === 1 ? 'y' : 'ies');
  const out = $('results'); out.replaceChildren();
  d.results.forEach(v => {
    const c = el('div', null, 'card');
    const h = el('h3', v.name);
    if (v.demo) h.prepend(el('span', 'DEMO, not a live NoBroker listing', 'tag demo'));
    c.append(h);
    const dl = el('dl');
    const rows = [['Locality', v.locality], ['Rent', v.monthlyRent], ['Accommodation', v.audience],
      ['Room sharing', v.sharing.join(', ')], ['Food', v.food.join(', ')], ['Amenities', v.amenities.join(', ')],
      ['Availability', v.availability], ['Verification', v.verification]];
    rows.forEach(([k, val]) => { dl.append(el('dt', k), el('dd', val)); });
    c.append(dl);
    if (v.notes) c.append(el('p', v.notes));
    if (v.contact) c.append(el('p', 'Contact: ' + v.contact));
    if (v.nobrokerUrl && v.nobrokerUrl.startsWith('https://')) {
      const a = el('a', 'View on NoBroker');
      a.href = v.nobrokerUrl; a.target = '_blank'; a.rel = 'noopener noreferrer';
      c.append(a, el('p', 'Verify current price and availability, and contact the provider, on NoBroker.'));
    }
    c.append(el('p', 'Source: ' + v.source + ' \u00b7 Last checked ' + v.lastChecked, 'small'));
    out.append(c);
  });
}
$('f').addEventListener('submit', search);
search();
</script>
</body>
</html>
