spring.datasource.url=jdbc:h2:file:./data/pgfinder
spring.jpa.hibernate.ddl-auto=update
spring.servlet.multipart.max-file-size=2MB
# Admin endpoints are disabled unless ADMIN_KEY is set in the environment.
app.admin-key=${ADMIN_KEY:}
# Seeds clearly labelled DEMO records only when the table is empty.
app.seed-demo=true

# Cloud hosts such as Render tell the app which port to use via PORT.
server.port=${PORT:8080}
